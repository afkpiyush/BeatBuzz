<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Beatbuzz | Explore</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="explore.css"/>
  <link rel="icon" type="image/png" href="Beatbuzz_icon.png">
</head>
<body>
  <div class="main-layout">
    <nav class="sidebar">
      <a href="explore.html" class="active"><i class="bi bi-compass"></i><span class="label">Explore</span></a>
      <a href="search.html"><i class="bi bi-search"></i><span class="label">Search</span></a>
      <a href="notification.html"><i class="bi bi-bell"></i><span class="label">Notifications</span></a>
      <a href="posts.html"><i class="bi bi-images"></i><span class="label">Posts</span></a>
      <a href="chat.html"><i class="bi bi-chat-dots"></i><span class="label">Chat</span></a>
      <a href="profile.html"><i class="bi bi-person"></i><span class="label">Profile</span></a>
      <a href="http://localhost:5000/logout"><i class="bi bi-box-arrow-right"></i><span class="label">Logout</span></a>
    </nav>

    <main class="center-feed">
      <div class="stories-bar">
        <div class="story"><div class="story-pic">BB</div><div class="story-name">You</div></div>
        <div class="story"><div class="story-pic"></div><div class="story-name">User</div></div>
        <div class="story"><div class="story-pic"></div><div class="story-name">User</div></div>
        <div class="story"><div class="story-pic"></div><div class="story-name">User</div></div>
        <div class="story"><div class="story-pic"></div><div class="story-name">User</div></div>
        <div class="story"><div class="story-pic"></div><div class="story-name">User</div></div>
      </div>
      <h2 class="explore-title">Explore Beatbuzz Profiles</h2>
      <div class="profile-cards">
        <!-- JS will populate profiles dynamically -->
      </div>
    </main>

    <aside class="profile-panel">
      <!-- Mini user card (kept for compatibility with existing JS) -->
      <div class="my-card">
        <img src="/uploads/default.jpg" alt="Your Profile Picture" class="your-pic" />
        <div class="my-card-info">
          <div class="your-name">Your Name</div>
          <div class="your-zodiac">♒ Aquarius</div>
        </div>
        <div class="your-bio">About me: Enthusiast, writer. I make my vibe visible wherever I go.</div>
      </div>

      <!-- Theme controls -->
      <div class="theme-controls">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <label class="form-check-label me-2" for="darkModeToggle">Dark mode</label>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="darkModeToggle" />
          </div>
        </div>
        <div class="accent-picker" aria-label="Accent color picker">
          <button class="accent-swatch" data-color="#e41955" style="--swatch:#e41955" title="Pink"></button>
          <button class="accent-swatch" data-color="#3b82f6" style="--swatch:#3b82f6" title="Blue"></button>
          <button class="accent-swatch" data-color="#22c55e" style="--swatch:#22c55e" title="Green"></button>
          <button class="accent-swatch" data-color="#f59e0b" style="--swatch:#f59e0b" title="Orange"></button>
          <button class="accent-swatch" data-color="#8b5cf6" style="--swatch:#8b5cf6" title="Purple"></button>
        </div>
      </div>

      <!-- Widgets -->
      <section class="widget widget-follow">
        <div class="widget-header">
          <h6>People to follow</h6>
          <a href="search.html" class="see-all">See all</a>
        </div>
        <div class="widget-body">
          <!-- Skeleton rows -->
          <div class="widget-row skeleton">
            <div class="skeleton-circle"></div>
            <div class="skeleton-line w-50"></div>
            <div class="skeleton-pill"></div>
          </div>
          <div class="widget-row skeleton">
            <div class="skeleton-circle"></div>
            <div class="skeleton-line w-50"></div>
            <div class="skeleton-pill"></div>
          </div>
          <div class="widget-row skeleton">
            <div class="skeleton-circle"></div>
            <div class="skeleton-line w-50"></div>
            <div class="skeleton-pill"></div>
          </div>
        </div>
      </section>

      <section class="widget widget-saved">
        <div class="widget-header">
          <h6>You Saved</h6>
          <a href="posts.html" class="see-all">See all</a>
        </div>
        <div class="saved-grid">
          <!-- Skeleton thumbnails -->
          <div class="thumb skeleton"></div>
          <div class="thumb skeleton"></div>
          <div class="thumb skeleton"></div>
          <div class="thumb skeleton"></div>
        </div>
      </section>

      <section class="widget widget-activity">
        <div class="widget-header">
          <h6>Recent Activity</h6>
          <a href="notification.html" class="see-all">See all</a>
        </div>
        <ul class="activity-list">
          <li class="skeleton"><div class="skeleton-line w-75"></div></li>
          <li class="skeleton"><div class="skeleton-line w-75"></div></li>
          <li class="skeleton"><div class="skeleton-line w-75"></div></li>
          <li class="skeleton"><div class="skeleton-line w-75"></div></li>
        </ul>
      </section>
    </aside>
  </div>
  
  <script src="../theme.js"></script>
  <script src="explore.js"></script>
</body>
</html>
